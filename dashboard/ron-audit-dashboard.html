<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ron — VANI Call Quality Audit</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
 --ink:#17202A;--muted:#566270;--faint:#8792A0;--paper:#F3F5F7;--panel:#FFFFFF;--line:#D6DCE2;--soft:#ECEFF3;
 --signal:#3346C8;--signal-soft:#E6E9FA;
 --fatal:#BE3328;--fatal-soft:#FBE7E4;--nf:#A8670E;--nf-soft:#FBEFD9;--pass:#2C7A4B;--pass-soft:#E1F1E6;
 --na:#EEF1F4;--unsc:#C9D0D8;--xna:#566270;
 --del-bg:#FDECEA;--del-hl:#F5B9B1;--add-bg:#E6F4EA;--add-hl:#A9DDB9;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --ink:#E6EBF0;--muted:#9EAAB6;--faint:#748190;--paper:#11161C;--panel:#1A2129;--line:#2D3741;--soft:#222B34;
 --signal:#8C9BFF;--signal-soft:#232A4A;--fatal:#F0857A;--fatal-soft:#3A2220;--nf:#E6B262;--nf-soft:#352A18;--pass:#7FCB9C;--pass-soft:#1C3326;
 --na:#222B34;--unsc:#3A4552;--xna:#9EAAB6;--del-bg:#3A2220;--del-hl:#7A3A33;--add-bg:#1C3326;--add-hl:#2F6544;}}
:root[data-theme="dark"]{
 --ink:#E6EBF0;--muted:#9EAAB6;--faint:#748190;--paper:#11161C;--panel:#1A2129;--line:#2D3741;--soft:#222B34;
 --signal:#8C9BFF;--signal-soft:#232A4A;--fatal:#F0857A;--fatal-soft:#3A2220;--nf:#E6B262;--nf-soft:#352A18;--pass:#7FCB9C;--pass-soft:#1C3326;
 --na:#222B34;--unsc:#3A4552;--xna:#9EAAB6;--del-bg:#3A2220;--del-hl:#7A3A33;--add-bg:#1C3326;--add-hl:#2F6544;}
*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{margin:0;height:100%;background:var(--paper);color:var(--ink);font:15.5px/1.55 "IBM Plex Sans","Noto Sans Devanagari",system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;line-height:1.15;margin:0}
code,.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
button{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:268px minmax(0,1fr);height:100%}
/* run nav */
.runs{border-right:1px solid var(--line);background:var(--panel);overflow-y:auto;display:flex;flex-direction:column}
.brand{padding:1.3rem 1.2rem 1rem;border-bottom:1px solid var(--line)}
.brand .eyebrow{font-size:.74rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.brand h1{font-size:1.35rem;margin-top:.25rem}
.brand p{margin:.35rem 0 0;font-size:.84rem;color:var(--muted)}
.runs h2{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-family:"IBM Plex Sans",sans-serif;font-weight:600;padding:1rem 1.2rem .4rem}
.runlist{list-style:none;margin:0;padding:0 .6rem 1rem}
.runbtn{display:block;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:6px;padding:.7rem .7rem .75rem;cursor:pointer;margin-bottom:.25rem}
.runbtn:hover{background:var(--soft)}
.runbtn[aria-current="true"]{background:var(--signal-soft);border-color:var(--signal)}
.runbtn .ts{font-family:"IBM Plex Sans Condensed",sans-serif;font-weight:600;font-size:1.02rem}
.runbtn .lbl{font-size:.8rem;color:var(--muted);margin-top:.1rem}
.mini{display:flex;height:6px;border-radius:3px;overflow:hidden;margin-top:.5rem;background:var(--soft)}
.mini i{display:block;height:100%}
.runbtn .cnt{font-size:.76rem;color:var(--muted);margin-top:.35rem}
.navfoot{margin-top:auto;padding:1rem 1.2rem;border-top:1px solid var(--line);font-size:.78rem;color:var(--muted)}
/* main */
main{overflow-y:auto;min-width:0}
.sub{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);display:flex;gap:.25rem;overflow-x:auto;padding:.5rem clamp(1rem,3vw,2.2rem)}
.sub a{white-space:nowrap;font-size:.85rem;color:var(--muted);text-decoration:none;padding:.3rem .6rem;border-radius:4px}
.sub a:hover{background:var(--soft);color:var(--ink)}
.wrap{padding:1.6rem clamp(1rem,3vw,2.2rem) 4rem;max-width:1240px}
section{padding-top:2.4rem;scroll-margin-top:3rem}
section:first-child{padding-top:0}
section>h2{font-size:1.45rem;font-weight:700;margin-bottom:.35rem}
.lede{color:var(--muted);max-width:78ch;margin:0 0 1rem}
.runhead .ts{font-family:"IBM Plex Sans Condensed",sans-serif;font-size:clamp(1.8rem,3.5vw,2.5rem);font-weight:700;line-height:1.1}
.runhead .meta{display:flex;flex-wrap:wrap;gap:.3rem 1.2rem;color:var(--muted);font-size:.88rem;margin:.5rem 0 .8rem}
.runhead .summary{max-width:82ch;font-size:1.02rem;margin:0}
.pill{display:inline-block;font-size:.75rem;font-weight:600;padding:.1rem .5rem;border-radius:999px;white-space:nowrap}
.p-F{background:var(--fatal-soft);color:var(--fatal)}.p-N{background:var(--nf-soft);color:var(--nf)}.p-P{background:var(--pass-soft);color:var(--pass)}
.p-A{background:var(--na);color:var(--muted)}.p-U{background:var(--soft);color:var(--muted);border:1px dashed var(--unsc)}.p-X{background:var(--soft);color:var(--xna)}
.p-s{background:var(--signal-soft);color:var(--signal)}
/* loop strip */
.loop{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin:1.3rem 0 0;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel)}
.loop div{padding:.75rem .9rem;border-right:1px solid var(--line);position:relative}
.loop div:last-child{border-right:0}
.loop b{display:block;font-family:"IBM Plex Sans Condensed",sans-serif;font-size:1rem}
.loop span{font-size:.82rem;color:var(--muted)}
.loop .st{position:absolute;top:.75rem;right:.8rem}
.loop div.done{box-shadow:inset 0 3px 0 var(--pass)} .loop div.pend{box-shadow:inset 0 3px 0 var(--nf)} .loop div.off{box-shadow:inset 0 3px 0 var(--unsc)}
@media (max-width:760px){.loop{grid-template-columns:repeat(2,minmax(0,1fr))}.loop div:nth-child(2){border-right:0}.loop div:nth-child(-n+2){border-bottom:1px solid var(--line)}}
/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:.6rem;margin-top:1rem}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:.7rem .8rem}
.kpi b{display:block;font-family:"IBM Plex Sans Condensed",sans-serif;font-size:1.7rem;line-height:1.1}
.kpi .k{font-size:.8rem;color:var(--muted)}
.kpi .d{font-size:.76rem;margin-top:.15rem;color:var(--muted)}
.kpi.F b{color:var(--fatal)}.kpi.N b{color:var(--nf)}.kpi.P b{color:var(--pass)}
.dist{display:flex;height:12px;border-radius:3px;overflow:hidden;margin:.9rem 0 .3rem;background:var(--soft)}
.legend{display:flex;flex-wrap:wrap;gap:.3rem 1rem;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:.7rem;height:.7rem;border-radius:2px;margin-right:.3rem;vertical-align:-1px}
/* panel metrics */
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.6rem;margin-top:.6rem}
.metric{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:.75rem .85rem}
.metric .t{font-size:.8rem;color:var(--muted);font-weight:600}
.metric .v{font-family:"IBM Plex Sans Condensed",sans-serif;font-size:1.25rem;font-weight:600;margin:.15rem 0}
.metric .x{font-size:.82rem;color:var(--muted)}
/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--panel);margin:.6rem 0 1rem}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{text-align:left;vertical-align:top;padding:.5rem .6rem;border-bottom:1px solid var(--line)}
th{background:var(--soft);font-family:"IBM Plex Sans Condensed",sans-serif;font-weight:600;font-size:.88rem;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.prio{display:flex;align-items:center;gap:.5rem;min-width:120px}
.prio .bar{flex:1;height:8px;background:var(--soft);border-radius:4px;overflow:hidden}.prio .bar i{display:block;height:100%;background:var(--signal)}
.rcrow{cursor:pointer}
.rcrow:hover td{background:var(--soft)}
.rcdetail td{background:var(--paper)}
.rcdetail .why{max-width:90ch;margin:.1rem 0 .5rem}
q.ev{display:block;quotes:none;border-left:3px solid var(--line);padding:.2rem .7rem;margin:.35rem 0;color:var(--ink)}
.evlink{font-size:.78rem;color:var(--signal);cursor:pointer;background:none;border:0;padding:0;text-decoration:underline}
.callout{background:var(--nf-soft);border-radius:6px;padding:.9rem 1.1rem;margin:1rem 0}
.callout h3{font-size:1.02rem;margin-bottom:.4rem}
.callout ul{margin:.2rem 0;padding-left:1.15rem}.callout li{margin:.3rem 0}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:6px;padding:1rem 1.1rem;color:var(--muted)}
/* fixes & diff */
.fix{background:var(--panel);border:1px solid var(--line);border-radius:6px;margin:1rem 0 1.4rem;overflow:hidden}
.fix header{padding:.85rem 1rem;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:.4rem .9rem;align-items:baseline}
.fix header h3{font-size:1.12rem}
.fix .sec{font-size:.82rem;color:var(--muted)}
.fix .note{padding:.6rem 1rem;font-size:.86rem;background:var(--signal-soft)}
.dtool{display:flex;justify-content:space-between;align-items:center;gap:.6rem;padding:.5rem 1rem;border-bottom:1px solid var(--line);font-size:.82rem;color:var(--muted);flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:.25rem .65rem;font-size:.8rem;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--signal-soft);color:var(--signal);font-weight:600}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:.25rem .65rem;font-size:.8rem;cursor:pointer;color:var(--signal);font-weight:600}
.btn:hover{background:var(--signal-soft)}
.diff{overflow-x:auto}
.diff table{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.78rem;line-height:1.5;table-layout:fixed;min-width:640px}
.diff td{border:0;padding:.12rem .5rem;white-space:pre-wrap;word-break:break-word;vertical-align:top}
.diff td.ln{width:2.6rem;text-align:right;color:var(--faint);user-select:none;padding-right:.6rem}
.diff td.sg{width:1.2rem;color:var(--faint);user-select:none;padding:0 .2rem}
.diff tr.hh td{background:var(--soft);color:var(--muted);font-size:.74rem;padding:.25rem .6rem}
.diff .del{background:var(--del-bg)} .diff .add{background:var(--add-bg)}
.diff .del mark{background:var(--del-hl);color:inherit;border-radius:2px;text-decoration:line-through;text-decoration-color:var(--fatal)}
.diff .add mark{background:var(--add-hl);color:inherit;border-radius:2px}
.diff .emp{background:repeating-linear-gradient(45deg,transparent 0 6px,var(--soft) 6px 12px)}
.diff.split td.mid{border-left:1px solid var(--line)}
.fixfoot{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:0;border-top:1px solid var(--line)}
.fixfoot>div{padding:.85rem 1rem}
.fixfoot>div+div{border-left:1px solid var(--line)}
.fixfoot h4{margin:0 0 .35rem;font-size:.9rem;font-family:"IBM Plex Sans Condensed",sans-serif}
.fixfoot p{margin:.2rem 0 .5rem;font-size:.86rem}
.fixfoot ul{margin:.2rem 0;padding-left:1.1rem;font-size:.86rem}
@media (max-width:820px){.fixfoot{grid-template-columns:minmax(0,1fr)}.fixfoot>div+div{border-left:0;border-top:1px solid var(--line)}}
.trail{list-style:none;margin:.3rem 0 0;padding:0}
.trail li{position:relative;padding:0 0 .6rem 1.3rem;font-size:.84rem}
.trail li::before{content:"";position:absolute;left:.25rem;top:.4rem;width:.55rem;height:.55rem;border-radius:50%;background:var(--unsc)}
.trail li.ok::before{background:var(--pass)}
.trail li::after{content:"";position:absolute;left:.48rem;top:1rem;bottom:-.1rem;width:1px;background:var(--line)}
.trail li:last-child::after{display:none}
.trail .w{color:var(--muted)}
/* matrix */
.mx{border-collapse:separate;border-spacing:0}
.mx th,.mx td{border-bottom:1px solid var(--line)}
.mx th.pn,.mx td.pn{position:sticky;left:0;background:var(--panel);z-index:1;min-width:210px;max-width:240px;white-space:normal;border-right:1px solid var(--line)}
.mx th.pn{background:var(--soft)}
.mx td.pn small{display:block;color:var(--muted);font-size:.74rem;line-height:1.3}
.mx th.ch{font-size:.76rem;text-align:center;min-width:86px;white-space:normal;line-height:1.25}
.cell{display:block;width:100%;min-height:2rem;border:0;border-radius:3px;font-size:.74rem;font-weight:600;cursor:pointer;padding:.3rem .2rem;text-align:center}
.c-P{background:var(--pass-soft);color:var(--pass)}.c-F{background:var(--fatal);color:#fff}.c-N{background:var(--nf-soft);color:var(--nf);box-shadow:inset 0 0 0 1.5px var(--nf)}
.c-A{background:var(--na);color:var(--faint)}.c-U{background:repeating-linear-gradient(135deg,var(--soft) 0 4px,transparent 4px 8px);color:var(--muted);box-shadow:inset 0 0 0 1px var(--unsc)}
.c-X{background:var(--soft);color:var(--xna)}
tr.overall td{background:var(--soft);font-weight:600}
.cellinfo{margin:.6rem 0 0;padding:.7rem .9rem;border-radius:6px;background:var(--panel);border:1px solid var(--line);font-size:.88rem;min-height:2.6rem}
/* queue & calls */
.flag{display:inline-block;font-size:.72rem;font-weight:600;padding:.05rem .4rem;border-radius:3px;margin:0 .2rem .2rem 0;background:var(--soft);color:var(--muted)}
.flag.frustration,.flag.wrong_requirement{background:var(--fatal-soft);color:var(--fatal)}
.flag.loop,.flag.human_request{background:var(--nf-soft);color:var(--nf)}
.rbar{width:80px;height:8px;background:var(--soft);border-radius:4px;overflow:hidden;display:inline-block;vertical-align:middle;margin-right:.4rem}.rbar i{display:block;height:100%;background:var(--fatal)}
.linkish{color:var(--signal);cursor:pointer;background:none;border:0;padding:0;font-weight:600;text-align:left}
.sim{font-size:.72rem;color:var(--muted)}
/* transcripts */
details.tr{background:var(--panel);border:1px solid var(--line);border-radius:6px;margin:.5rem 0}
details.tr summary{cursor:pointer;padding:.6rem .9rem;font-size:.9rem;display:flex;flex-wrap:wrap;gap:.3rem .8rem;align-items:center}
.turns{padding:.2rem .9rem .8rem;max-height:520px;overflow-y:auto}
.turn{display:grid;grid-template-columns:2.2rem 3.6rem minmax(0,1fr);gap:.4rem;padding:.3rem .3rem;border-radius:4px;font-size:.9rem}
.turn .n{color:var(--faint);font-size:.76rem;text-align:right;padding-top:.15rem}
.turn .who{font-size:.74rem;font-weight:600;padding-top:.15rem;color:var(--muted)}
.turn.agent .who{color:var(--signal)}
.turn.hl{background:var(--nf-soft);box-shadow:inset 3px 0 0 var(--nf)}
/* method */
.method{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:1rem 1.2rem}
.method h3{font-size:1.02rem;margin:1rem 0 .35rem}.method h3:first-child{margin-top:0}
.method p,.method li{font-size:.9rem;max-width:90ch}
.method ul{padding-left:1.15rem;margin:.2rem 0}
footer{margin-top:2.5rem;font-size:.8rem;color:var(--muted)}
@media (max-width:900px){
 .app{grid-template-columns:minmax(0,1fr);height:auto}
 body{height:auto}
 .runs{border-right:0;border-bottom:1px solid var(--line)}
 .runlist{display:flex;gap:.4rem;overflow-x:auto;padding-bottom:.8rem}
 .runlist li{flex:0 0 220px}
 .navfoot{display:none}
 main{overflow:visible}
}
</style>
</head>

 /* transcripts */
 h+='<section id="transcripts"><h2>Transcripts</h2>';
 run.calls.forEach(function(cc,i){h+='<details class="tr" id="tr-'+i+'"><summary><b>'+esc(callLabel(cc))+'</b><span class="sim">'+cc.turns.length+' turns · '+cc.dur+' s · '+esc(cc.product)+'</span>'+vpill(cc)+'</summary><div class="turns">'+cc.turns.map(function(t,ti){return '<div class="turn '+t.role+'" id="t-'+i+'-'+(ti+1)+'"><span class="n">'+(ti+1)+'</span><span class="who">'+(t.role==='agent'?'Agent':'Buyer')+'</span><span>'+esc(t.text)+'</span></div>'}).join('')+'</div></details>'});
 h+='</section>';
 /* method */
 h+='<section id="method"><h2>Method &amp; limitations</h2><div class="method">'+
  '<h3>Ruleset</h3><p>'+esc(run.ruleset)+'</p>'+
  '<h3>How verdicts are derived</h3><ul><li>Each parameter is Pass, Fatal, Non-fatal, N/A (did not apply) or Unscorable (applied, but the data needed was missing). Every Fatal or Non-fatal cites a call, a turn and a quote.</li><li>Overall Call is Fatal if any parameter is Fatal, Non-fatal if any is Non-fatal, otherwise Pass. A call with an Unscorable parameter that could have been Fatal is marked as a partial audit.</li><li>Captured values come from the agent\'s final variables, never from the transcript. Where the export has no captured record, capture parameters are Unscorable.</li><li>WER is flagged only on evidence in the transcript (buyer corrections, read-back mismatches); audio was not checked. Dead air needs turn timestamps or audio.</li></ul>'+
  ((run.defaults_used||[]).length?'<h3>Interpretation defaults used</h3><ul>'+run.defaults_used.map(function(d){return '<li><b>'+esc(d[0])+'</b> — '+esc(d[1])+' ('+d[2]+' calls)</li>'}).join('')+'</ul>':'')+
  ((run.confirmations||[]).length?'<h3>Waiting for the matrix owner to confirm</h3><ul>'+run.confirmations.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>':'')+
  '<h3>Known limitations of this data</h3><ul><li>Call ids in the export are shared prefixes (two ids across eight calls), so calls are identified by id and start time. Full interaction ids are needed for traceability.</li><li>Three calls look simulated (buyer speaks first, 6–12 turns in about 23 seconds); they are kept in the counts and marked.</li><li>Run times are as stamped by the job that produced each run.</li><li>Priority weights and risk weights are heuristic and shown so they can be challenged.</li></ul></div>'+
  '<footer>Ron call-quality audit · VANI Call Quality Matrix · '+RUNS.length+' run'+(RUNS.length>1?'s':'')+' in history · generated '+esc(RUNS[0].generated_at)+'</footer></section>';
 document.getElementById('view').innerHTML=h;
 document.getElementById('main').scrollTop=0;window.scrollTo(0,0);
}
function vpill(c){var k={'Fatal':'F','Non-fatal':'N','Pass':'P','Not analysed':'X'}[c.verdict];return '<span class="pill p-'+k+'">'+esc(c.verdict)+(c.partial?' · partial':'')+'</span>'}
function openTurn(ci,turn){var d=document.getElementById('tr-'+ci);if(!d)return;d.open=true;document.querySelectorAll('.turn.hl').forEach(function(x){x.classList.remove('hl')});
 var t=turn?document.getElementById('t-'+ci+'-'+turn):null;var target=t||d;if(t)t.classList.add('hl');target.scrollIntoView({behavior:'smooth',block:'center'})}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
 var an=e.target.closest('a[href^="#"]');if(an){var tg=document.getElementById(an.getAttribute('href').slice(1));if(tg){e.preventDefault();tg.scrollIntoView({behavior:'smooth',block:'start'})}return}
 var rb=e.target.closest('.runbtn');if(rb){select(rb.dataset.run);return}
 var rr=e.target.closest('.rcrow');if(rr){var d=document.getElementById('rcd-'+rr.dataset.rc);var open=d.hidden;d.hidden=!open;rr.setAttribute('aria-expanded',String(open));return}
 var ev=e.target.closest('[data-call]');if(ev){openTurn(+ev.dataset.call,ev.dataset.turn?+ev.dataset.turn:null);return}
 var sb=e.target.closest('.seg button');if(sb){var fi=+sb.dataset.fix,f=current.fixes[fi],el=document.getElementById('diff-'+fi);
  sb.parentNode.querySelectorAll('button').forEach(function(b){b.setAttribute('aria-pressed',String(b===sb))});
  if(sb.dataset.mode==='split'){el.className='diff split';el.innerHTML=renderDiff(hunksOf(f))}else{el.className='diff unified';el.innerHTML=renderUnified(hunksOf(f))}return}
 var cb=e.target.closest('[data-copyfix]');if(cb){var f2=current.fixes[+cb.dataset.copyfix];var txt=hunksOf(f2).map(function(h){return h.after}).join('\n\n');copy(txt,cb);return}
 var ce=e.target.closest('.cell');if(ce){var p=ce.dataset.cell.split('|'),ci=+p[0],c=current.calls[ci],x=c.cells[p[1]],pn=PARAMS.filter(function(q){return q[0]===p[1]})[0][1];
  var info=document.getElementById('cellinfo');info.innerHTML='<b>'+esc(pn)+'</b> · '+esc(callLabel(c))+' · <span class="pill p-'+x.s+'">'+SNAME[x.s]+'</span><br>'+esc(x.note||'')+(x.rule?' <span class="sim">(rule '+esc(x.rule)+')</span>':'')+(x.turn?' <button class="evlink" data-call="'+ci+'" data-turn="'+x.turn+'">Open turn '+x.turn+'</button>':'');return}
});
document.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('rcrow')){e.preventDefault();e.target.click()}});
function copy(t,btn){function ok(){var o=btn.textContent;btn.textContent='Copied';setTimeout(function(){btn.textContent=o},1300)}
 function fb(){var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');ok()}catch(x){}document.body.removeChild(ta)}
 if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(ok,fb);else fb()}
function select(id){var run=RUNS.filter(function(r){return r.id===id})[0]||RUNS[0];renderNav(run.id);render(run);try{history.replaceState(null,'','#run='+encodeURIComponent(run.id))}catch(x){}}
var m=/run=([^&]+)/.exec(location.hash);select(m?decodeURIComponent(m[1]):RUNS[0].id);
})();
</script>
</body>
</html>
